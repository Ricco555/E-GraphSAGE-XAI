# GCN edge-classifier baseline configuration.
#
# Run: python scripts/train_gcn.py --config configs/gcn.yaml

dataset:
  root: datasets/nfunsw_nb15

model:
  type: gcn
  hidden: 128
  dropout: 0.4

training:
  fanouts: [25, 15]           # exactly 2 fanouts required (GCNEdgeClassifier is 2-layer)
  batch_size: 512
  epochs: 20
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 0
  seed: 42
  device: auto

out:
  artifacts_dir: artifacts
  checkpoint: artifacts/best_gcn.pt
  train_log: artifacts/train_log_gcn.json
